<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16171a">
<title>Wortkasten</title>
<meta name="description" content="Wortkasten – German flashcards with spaced repetition, built-in dictionary and der/die/das colours.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortkasten">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"><b style="background:#1b5fd9"></b><b style="background:#d7262e"></b><b style="background:#f3c300"></b></span><span>Wortkasten</span></div>
  <div class="sync" id="sync" role="status">Loading…</div>
  <button class="iconbtn langbtn" id="langBtn" data-act="cycleLang" aria-label="Language">EN</button>
  <button class="iconbtn" id="gear" data-act="tab" data-tab="settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></button>
</header>

<main>
  <section id="v-review"><p class="busy"><span class="spin"></span>Loading…</p></section>
  <section id="v-add" hidden></section>
  <section id="v-dict" hidden></section>
  <section id="v-words" hidden></section>
  <section id="v-settings" hidden></section>
  <noscript><p class="notice">This app needs JavaScript.</p></noscript>
</main>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-act="tab" data-tab="review" aria-current="page"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="7" width="13" height="13" rx="2.5"/><path d="M7.5 4h10a3 3 0 0 1 3 3v10"/></svg><span data-t="tab_review">Review</span><span class="badge hide" id="badge"></span></button>
  <button data-act="tab" data-tab="add"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg><span data-t="tab_add">Add</span></button>
  <button data-act="tab" data-tab="dict"><svg class="i" viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5"/><path d="M9 8.5h6"/></svg><span data-t="tab_dict">Dictionary</span></button>
  <button data-act="tab" data-tab="words"><svg class="i" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="17.5" r="1.2"/></svg><span data-t="tab_words">My words</span></button>
</nav>

<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<datalist id="catlist"></datalist>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
